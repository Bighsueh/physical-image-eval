# Serve the SPA and proxy /api to the backend container (prod; behind Cloudflared).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API → backend service on the compose network.
  location /api/ {
    proxy_pass http://backend:3100;

    # Reference-photo uploads carry the original (up to PHOTO_MAX_FILE_BYTES = 25 MiB) plus a
    # display derivative and, for HEIC, a full-size JPEG. nginx's 1 MiB default would reject a
    # normal phone photo with a bare 413 that never reaches the app — so the reviewer would see
    # a generic failure instead of our zh-TW message. Sized above the backend's own cap so the
    # backend stays the single place a size limit is decided and explained.
    client_max_body_size 64m;
    # Streamed ZIP downloads and multi-megabyte uploads outlive the 60s default on slow links.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA history fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
