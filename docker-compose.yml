# physical-image-eval — local/prod compose (constitution X: fixed ports; constitution II: image source READ-ONLY).
# Dev ports: postgres 5433→5432, backend 3100, frontend 5180 (avoid host-occupied 5000/7000/5432/32222).

services:
  postgres:
    image: postgres:16-alpine
    container_name: pie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pie}
      POSTGRES_DB: ${POSTGRES_DB:-physical_image_eval}
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pie} -d ${POSTGRES_DB:-physical_image_eval}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pie-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://pie:pie@postgres:5432/physical_image_eval?schema=public}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: '3100'
      # Absolute path INSIDE the container to the read-only image-source bind mount (see volumes).
      IMAGE_SOURCE_DIR: ${IMAGE_SOURCE_DIR:-/data/blueprints}
      SESSION_ABSOLUTE_TTL: ${SESSION_ABSOLUTE_TTL:-12h}
      SESSION_IDLE_TTL: ${SESSION_IDLE_TTL:-60m}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SID_NAME: ${COOKIE_SID_NAME:-pie_sid}
      COOKIE_CSRF_NAME: ${COOKIE_CSRF_NAME:-pie_csrf}
      ARGON2_MEMORY_KIB: ${ARGON2_MEMORY_KIB:-19456}
      ARGON2_ITERATIONS: ${ARGON2_ITERATIONS:-2}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-1}
      LOGIN_RATE_MAX: ${LOGIN_RATE_MAX:-10}
      LOGIN_RATE_WINDOW: ${LOGIN_RATE_WINDOW:-15m}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?set a strong bootstrap admin password}
    # SEC-M1: do NOT publish 3100 to the host in prod — the frontend nginx reaches the backend over
    # the compose network (http://backend:3100), keeping the API behind Cloudflared only. For local
    # debugging, run the backend on the host (npm run dev -w backend) or add a dev compose override.
    expose:
      - '3100'
    volumes:
      # Image source mounted READ-ONLY (:ro) — never written to (constitution II spirit). For local
      # testing this is the repo-bundled ./images (a copy of the source; gitignored). To run against
      # the original external dataset instead, override IMAGE_SOURCE in .env with its absolute path.
      - type: bind
        source: ${IMAGE_SOURCE:-./images}
        target: /data/blueprints
        read_only: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pie-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '5180:80'

volumes:
  pgdata:
